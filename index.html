<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>薪水換熱量 | 午餐選擇器</title>
<meta name="description" content="不知道吃啥?選擇內用或外帶,我來決定!">
<meta property="og:type" content="website">
<meta property="og:title" content="薪水換熱量">
<meta property="og:description" content="不知道吃啥?選擇內用或外帶,我來決定!">
<style>
  :root{
    --red:#E4002B;
    --blue:#003A8C;
    --green:#00A58E;
    --white:#FFFFFF;
    --bg:#F3F6FA;
    --text:#1b2433;
    --muted:#6b778c;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
    background:var(--bg);color:var(--text);line-height:1.5;
  }
  button{touch-action:manipulation}
  header{
    background:var(--blue);color:var(--white);
    text-align:center;padding:28px 16px 22px;position:relative;
  }
  header h1{font-size:clamp(28px,6vw,42px);letter-spacing:4px}
  header p{opacity:.85;margin-top:4px;font-size:14px}
  main{max-width:860px;margin:0 auto;padding:24px 16px 60px}
  .question{font-size:16px;color:var(--muted);font-weight:600;margin-bottom:12px;text-align:center}
  /* 兩個選項 */
  .modes{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .mode-btn{
    border:3px solid var(--blue);background:var(--white);color:var(--blue);
    border-radius:16px;padding:20px 8px;font-size:clamp(20px,5vw,26px);font-weight:700;cursor:pointer;
    transition:.15s;line-height:1.3;
  }
  .mode-btn .ico{display:block;font-size:1.3em;margin-bottom:2px}
  .mode-btn:active{transform:scale(.97)}
  .mode-btn[data-mode="內用"]{border-color:var(--blue);color:var(--blue)}
  .mode-btn[data-mode="外帶"]{border-color:var(--red);color:var(--red)}
  .mode-btn.active[data-mode="內用"]{background:var(--blue);color:var(--white)}
  .mode-btn.active[data-mode="外帶"]{background:var(--red);color:var(--white)}
  .draw{margin-top:26px;text-align:center}
  .draw-btn{
    width:100%;max-width:420px;border:none;background:var(--green);color:var(--white);
    font-size:22px;font-weight:700;padding:18px;border-radius:16px;cursor:pointer;
    box-shadow:0 6px 0 #007a69;transition:.1s;
  }
  .draw-btn:active{transform:translateY(4px);box-shadow:0 2px 0 #007a69}
  .draw-btn:disabled{background:#b8c2d0;box-shadow:0 6px 0 #97a3b5;cursor:not-allowed}
  .result{
    margin-top:18px;background:var(--white);border-radius:16px;padding:22px 16px;
    border-top:6px solid var(--green);min-height:110px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
    box-shadow:0 4px 14px rgba(0,0,0,.06);
  }
  .result .name{font-size:clamp(26px,6vw,36px);font-weight:800;color:var(--blue)}
  .result .meta{color:var(--muted);font-size:14px}
  .result.spin .name{color:var(--muted)}
  .result.pop{animation:pop .4s}
  @keyframes pop{0%{transform:scale(.9)}60%{transform:scale(1.05)}100%{transform:scale(1)}}
  .list-title{margin-top:34px;display:flex;justify-content:space-between;align-items:center}
  .list-title h2{font-size:18px;color:var(--blue)}
  .list-title span{color:var(--muted);font-size:14px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px;margin-top:12px}
  .card{
    background:var(--white);border-radius:12px;padding:14px;
    border-left:5px solid var(--blue);box-shadow:0 2px 8px rgba(0,0,0,.05);
  }
  .card h3{font-size:17px}
  .tags{margin:6px 0 0;display:flex;flex-wrap:wrap;gap:6px}
  .tag{font-size:12px;padding:2px 8px;border-radius:6px;background:#e8eef7;color:var(--blue)}
  .tag.dine{background:#e3edff;color:var(--blue)}
  .tag.take{background:#ffe5e9;color:var(--red)}
  .card .note{font-size:13px;color:var(--muted);margin-top:6px}
  .empty{text-align:center;color:var(--muted);padding:30px 0;grid-column:1/-1}
  footer{text-align:center;color:var(--muted);font-size:12px;padding:20px}

  /* 新增候選店家(小按鈕) */
  .add-box{margin-top:28px;text-align:center}
  .add-link{
    display:inline-block;
    border:1.5px dashed var(--blue);color:var(--blue);background:var(--white);
    border-radius:999px;padding:8px 18px;font-size:14px;font-weight:600;text-decoration:none;
  }
  .add-link:active{transform:scale(.97)}
  .add-hint{color:var(--muted);font-size:12px;margin-top:6px;opacity:.85}

  /* ===== 喝不喝飲料(擲硬幣) ===== */
  .coin-section{
    margin-top:28px;padding-top:30px;border-top:2px dashed #cfd8e6;text-align:center;
  }
  .coin-section h2{font-size:20px;color:var(--blue);margin-bottom:6px}
  .coin-sub{font-size:13px;color:var(--muted);margin-bottom:22px}
  .coin-wrap{
    width:140px;height:140px;margin:0 auto;perspective:800px;cursor:pointer;
    -webkit-tap-highlight-color:transparent;
  }
  .coin-wrap.toss{animation:toss 1.4s ease-out}
  @keyframes toss{
    0%{transform:translateY(0)}
    40%{transform:translateY(-60px)}
    100%{transform:translateY(0)}
  }
  .coin{
    width:100%;height:100%;position:relative;transform-style:preserve-3d;
    transition:transform 1.4s cubic-bezier(.2,.7,.2,1);
  }
  .coin-face{
    position:absolute;inset:0;border-radius:50%;
    backface-visibility:hidden;-webkit-backface-visibility:hidden;
    display:flex;align-items:center;justify-content:center;
    font-size:38px;font-weight:800;color:var(--white);letter-spacing:2px;
    border:7px solid rgba(255,255,255,.55);
    box-shadow:inset 0 0 0 4px rgba(0,0,0,.12),0 8px 16px rgba(0,0,0,.22);
  }
  .coin-face.unknown{background:var(--blue);font-size:60px;letter-spacing:0}
  .coin-face.yes{background:var(--green)}
  .coin-face.no{background:var(--red);transform:rotateY(180deg)}

  .coin-result{
    min-height:40px;margin-top:22px;
    display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:8px 12px;
  }
  .coin-result.pop{animation:pop .4s}
  .coin-main{font-size:clamp(24px,6vw,30px);font-weight:800;color:var(--blue)}
  .coin-quip{
    font-size:15px;font-weight:600;color:var(--white);
    padding:6px 14px;border-radius:999px;line-height:1.4;
  }
  .coin-quip.yes{background:var(--green)}
  .coin-quip.no{background:var(--red)}

  .coin-btn{
    width:100%;max-width:420px;margin-top:6px;border:none;background:var(--blue);color:var(--white);
    font-size:20px;font-weight:700;padding:16px;border-radius:16px;cursor:pointer;
    box-shadow:0 6px 0 #00285f;transition:.1s;
  }
  .coin-btn:active{transform:translateY(4px);box-shadow:0 2px 0 #00285f}
  .coin-btn:disabled{background:#b8c2d0;box-shadow:0 6px 0 #97a3b5;cursor:not-allowed}

  /* ===== 迷你小工具:猜拳 + 木魚(並排) ===== */
  .mini-row{
    display:grid;grid-template-columns:1fr 1fr;gap:12px;
    margin-top:34px;padding-top:26px;border-top:2px dashed #cfd8e6;
  }
  .mini{
    position:relative;overflow:hidden;
    background:var(--white);border-radius:14px;padding:12px 8px 14px;text-align:center;
    box-shadow:0 2px 8px rgba(0,0,0,.05);
  }
  .mini.rps{
    border-top:5px solid var(--blue);
    display:flex;flex-direction:column;justify-content:center;  /* 內容垂直置中 */
  }
  .mini.fish{border-top:5px solid var(--red)}
  .mini h3{font-size:15px;color:var(--blue);margin-bottom:8px}
  .mini .sub{font-size:12px;color:var(--muted);min-height:18px;margin-top:6px}

  /* 猜拳(按鈕平均分配寬度,稍微放大) */
  .rps-btns{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin-top:6px}
  .rps-btn{
    border:2px solid #cfd8e6;background:var(--bg);border-radius:12px;
    font-size:27px;line-height:1;padding:10px 0;width:100%;cursor:pointer;transition:.1s;
  }
  .rps-btn:active{transform:scale(.9);border-color:var(--blue)}
  .rps-out{min-height:42px;margin-top:8px;font-size:14px;font-weight:700;color:var(--text)}  /* 預留兩行高度,避免跳動 */
  .rps-out.win{color:var(--green)}
  .rps-out.lose{color:var(--red)}
  .rps-out.tie{color:var(--muted)}
  .rps-out.pop{animation:pop .3s}

  /* 木魚 */
  .fish-top{position:absolute;top:6px;right:6px}
  .mute-btn{border:none;background:transparent;font-size:14px;cursor:pointer;opacity:.7;padding:2px}
  .fish-btn{
    width:76px;height:76px;border-radius:50%;border:none;cursor:pointer;
    background:radial-gradient(circle at 35% 30%,#ff4d6a,var(--red) 60%,#a50020);
    color:var(--white);font-size:18px;font-weight:800;letter-spacing:1px;
    box-shadow:0 5px 0 #7a0018;transition:.06s;-webkit-tap-highlight-color:transparent;
  }
  .fish-btn:active,.fish-btn.hit{transform:translateY(4px) scale(.96);box-shadow:0 1px 0 #7a0018}
  .fish-count{margin-top:10px;font-size:14px;font-weight:700;color:var(--blue)}
  .plus{
    position:absolute;left:50%;top:44%;transform:translateX(-50%);
    font-size:18px;font-weight:800;color:#FFB300;pointer-events:none;white-space:nowrap;
    text-shadow:0 1px 3px rgba(0,0,0,.45);
    animation:floatUp .9s ease-out forwards;
  }
  @keyframes floatUp{
    0%{opacity:1;transform:translate(-50%,0)}
    100%{opacity:0;transform:translate(-50%,-48px)}
  }
</style>
</head>
<body>
<header>
  <h1>薪水換熱量</h1>
  <p>今天中午,要吃什麼?</p>
</header>
<main>
  <p class="question">內用還是外帶?</p>
  <div class="modes">
    <button class="mode-btn" data-mode="內用"><span class="ico">🍽️</span>內用</button>
    <button class="mode-btn" data-mode="外帶"><span class="ico">🥡</span>外帶</button>
  </div>
  <section class="draw">
    <button class="draw-btn" id="drawBtn" disabled>請先選內用或外帶</button>
    <div class="result" id="result" hidden></div>
  </section>
  <section id="listSection" hidden>
    <div class="list-title">
      <h2>候選名單</h2><span id="count"></span>
    </div>
    <div class="grid" id="grid"></div>
  </section>

  <!-- 新增候選店家 -->
  <div class="add-box">
    <a class="add-link" href="https://forms.gle/sAkoeXp1YPQdkjMS8" target="_blank" rel="noopener">➕ 點我前往新增候選店家</a>
    <p class="add-hint">填寫表單後,需等待 2-5 分鐘才會更新至系統</p>
  </div>

  <!-- 喝不喝飲料 -->
  <section class="coin-section">
    <h2>🥤 喝不喝飲料</h2>
    <p class="coin-sub">讓硬幣來決定!</p>
    <div class="coin-wrap" id="coinWrap">
      <div class="coin" id="coin">
        <div class="coin-face unknown" id="coinFront">?</div>
        <div class="coin-face no">不喝</div>
      </div>
    </div>
    <div class="coin-result" id="coinResult"></div>
    <button class="coin-btn" id="coinBtn">🪙 擲硬幣</button>
  </section>

  <!-- 猜拳 + 電子木魚(並排) -->
  <section class="mini-row">
    <div class="mini rps">
      <h3>✊ 跟電腦猜拳</h3>
      <div class="rps-btns">
        <button class="rps-btn" data-i="0" aria-label="石頭">✊</button>
        <button class="rps-btn" data-i="1" aria-label="剪刀">✌️</button>
        <button class="rps-btn" data-i="2" aria-label="布">✋</button>
      </div>
      <div class="rps-out" id="rpsOut">出拳吧!</div>
      <div class="sub" id="rpsScore">勝 0 ・ 平 0 ・ 負 0</div>
    </div>

    <div class="mini fish" id="fishBox">
      <div class="fish-top"><button class="mute-btn" id="muteBtn" aria-label="音效開關">🔊</button></div>
      <h3>🐟 電子木魚</h3>
      <button class="fish-btn" id="fishBtn" aria-label="敲木魚">木魚</button>
      <div class="fish-count" id="fishCount">功德 0</div>
      <div class="sub">敲一下 破事少一件</div>
    </div>
  </section>
</main>
<footer>薪水換熱量 © 吃飽睡覺準備下班</footer>
<!-- 每次開啟都抓最新的餐廳清單,避免吃到舊快取 -->
<script>
  document.write('<script src="restaurants.js?t=' + Date.now() + '"><\/script>');
</script>
<script>
let mode = null;
// 試算表「發布到網路」的 CSV 連結
const SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTlGKx3rsESOzmwvtdJbuFLMAncPRZAYEj7jlnnrE88yUYSxlMU1F1gNf7LwqnM5IaPp4a7WEwZm2gP/pub?gid=600908702&single=true&output=csv";
// 先放 restaurants.js 裡的固定清單,再合併表單來的資料
let ALL = [...RESTAURANTS];
function parseCSV(text){
  const rows = []; let row = [], cell = "", q = false;
  for (let i = 0; i < text.length; i++){
    const c = text[i];
    if (q){
      if (c === '"'){ if (text[i+1] === '"'){ cell += '"'; i++; } else q = false; }
      else cell += c;
    } else if (c === '"') q = true;
    else if (c === ',') { row.push(cell); cell = ""; }
    else if (c === '\n'){ row.push(cell); rows.push(row); row = []; cell = ""; }
    else if (c !== '\r') cell += c;
  }
  if (cell || row.length){ row.push(cell); rows.push(row); }
  return rows;
}
async function loadSheet(){
  if (!SHEET_CSV_URL.startsWith("http")) return;
  try{
    const res = await fetch(SHEET_CSV_URL + "&t=" + Date.now());
    const rows = parseCSV(await res.text());
    const head = rows[0].map(h => h.trim());
    const extra = rows.slice(1).map(r => {
      const get = n => (r[head.indexOf(n)] || "").trim();
      return {
        name: get("店名"),
        area: get("地區"),
        modes: ["內用","外帶"].filter(m => get("用餐方式").includes(m))
      };
    }).filter(r => r.name && r.modes.length);
    const names = new Set(ALL.map(r => r.name));
    extra.forEach(r => { if (!names.has(r.name)){ ALL.push(r); names.add(r.name); } });
    renderList();
  }catch(e){ console.warn("讀取表單資料失敗", e); }
}
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c =>
  ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
function filtered(){
  return ALL.filter(r => r.modes.includes(mode));
}
// 內用外帶皆可的店,顯示「也可外帶」或「也可內用」
function modeTags(r){
  const both = r.modes.includes("內用") && r.modes.includes("外帶");
  if (!both) return "";
  return mode === "內用"
    ? `<span class="tag take">也可外帶</span>`
    : `<span class="tag dine">也可內用</span>`;
}
function renderList(){
  const list = mode ? filtered() : [];
  $("listSection").hidden = !mode;
  $("count").textContent = `共 ${list.length} 間`;
  $("grid").innerHTML = list.length ? list.map(r => `
    <div class="card">
      <h3>${esc(r.name)}</h3>
      <div class="tags">
        ${r.area ? `<span class="tag">📍${esc(r.area)}</span>` : ""}
        ${r.category ? `<span class="tag">${esc(r.category)}</span>` : ""}
        ${r.price ? `<span class="tag">💰${esc(r.price)}</span>` : ""}
        ${modeTags(r)}
      </div>
      ${r.note ? `<div class="note">${esc(r.note)}</div>` : ""}
    </div>`).join("")
    : `<div class="empty">目前沒有符合的餐廳 😅</div>`;
  const btn = $("drawBtn");
  btn.disabled = !mode || list.length === 0;
  btn.textContent = !mode ? "請先選內用或外帶"
                  : list.length === 0 ? "沒有符合的餐廳"
                  : "🎲 抽!";
}
document.querySelectorAll(".mode-btn").forEach(b => b.addEventListener("click", () => {
  mode = b.dataset.mode;
  document.querySelectorAll(".mode-btn").forEach(x => x.classList.toggle("active", x === b));
  $("result").hidden = true;
  renderList();
}));
let timer = null;
$("drawBtn").addEventListener("click", () => {
  const list = filtered();
  if (!list.length) return;
  const box = $("result");
  const btn = $("drawBtn");
  clearInterval(timer);
  box.hidden = false;
  box.className = "result spin";
  btn.disabled = true;
  timer = setInterval(() => {
    const r = list[Math.floor(Math.random() * list.length)];
    box.innerHTML = `<div class="name">${esc(r.name)}</div>`;
  }, 80);
  setTimeout(() => {
    clearInterval(timer);
    const r = list[Math.floor(Math.random() * list.length)];
    box.className = "result pop";
    box.innerHTML = `
      <div class="meta">今天就吃 ↓</div>
      <div class="name">${esc(r.name)}</div>
      <div class="meta">${esc([r.area, r.category, r.price].filter(Boolean).join(" ・ "))}</div>
      ${r.note ? `<div class="meta">${esc(r.note)}</div>` : ""}`;
    btn.disabled = false;
    btn.textContent = "🎲 再抽一次";
  }, 1400);
});

// ---------- 喝不喝飲料(擲硬幣) ----------
// ▼ 想改語錄,直接改這裡的文字就好(每句要用引號包起來、結尾加逗號)
const QUIPS = {
  yes: [
    "喝啦 哪次不喝?",
    "不喝飲料難道要喝水嗎?",
    "人生苦短 先喝再說",
    "一杯解決不了的話 就喝兩杯",
    "問就是要喝"
  ],
  no: [
    "不是要減肥嗎 喝什麼飲料?",
    "體重計正默默看著你",
    "手搖杯不會跑 但你的存款會",
    "省幾次飲料錢就可以買機票了還喝",
    "喝水不好嗎?"
  ]
};
const lastQuip = { yes: -1, no: -1 };

// 隨機挑一句,且不和上一次同一邊挑到的一樣
function pickQuip(side){
  const list = QUIPS[side];
  let i;
  do { i = Math.floor(Math.random() * list.length); }
  while (list.length > 1 && i === lastQuip[side]);
  lastQuip[side] = i;
  return list[i];
}

let coinAngle = 0;
let flipping = false;
function flipCoin(){
  if (flipping) return;
  flipping = true;
  const drink = Math.random() < 0.5;            // true = 喝(正面),false = 不喝(反面)
  const wrap = $("coinWrap"), coin = $("coin"), out = $("coinResult"), btn = $("coinBtn");
  const front = $("coinFront");

  btn.disabled = true;
  out.innerHTML = "";
  out.className = "coin-result";

  // 先對齊到正面,再多轉 5 圈;不喝就多加半圈停在反面
  const base = Math.ceil(coinAngle / 360) * 360;
  coinAngle = base + 360 * 5 + (drink ? 0 : 180);
  coin.style.transform = `rotateY(${coinAngle}deg)`;

  // 硬幣高速旋轉時,把正面從「?」悄悄換成「喝」
  if (drink) {
    setTimeout(() => {
      front.className = "coin-face yes";
      front.textContent = "喝";
    }, 250);
  }

  // 重新觸發彈起動畫
  wrap.classList.remove("toss");
  void wrap.offsetWidth;
  wrap.classList.add("toss");

  setTimeout(() => {
    const side = drink ? "yes" : "no";
    out.innerHTML =
      `<span class="coin-main">${drink ? "🥤 喝!" : "🚫 不喝!"}</span>` +
      `<span class="coin-quip ${side}">${esc(pickQuip(side))}</span>`;
    out.className = "coin-result pop";
    btn.disabled = false;
    btn.textContent = "🪙 再擲一次";
    flipping = false;
  }, 1450);
}
$("coinWrap").addEventListener("click", flipCoin);
$("coinBtn").addEventListener("click", flipCoin);

// ---------- 跟電腦猜拳 ----------
const RPS = ["✊", "✌️", "✋"];            // 0 石頭、1 剪刀、2 布
const score = { w: 0, t: 0, l: 0 };
document.querySelectorAll(".rps-btn").forEach(b => b.addEventListener("click", () => {
  const me = Number(b.dataset.i);
  const cpu = Math.floor(Math.random() * 3);
  const d = (me - cpu + 3) % 3;             // 0 平手、2 你贏、1 你輸
  const out = $("rpsOut");
  let text, cls;
  if (d === 0){ score.t++; text = "平手 🤝"; cls = "tie"; }
  else if (d === 2){ score.w++; text = "你贏了 🎉"; cls = "win"; }
  else { score.l++; text = "你輸了 😭"; cls = "lose"; }
  out.className = "rps-out pop " + cls;
  out.innerHTML = `${RPS[me]} vs ${RPS[cpu]}<br>${text}`;
  $("rpsScore").textContent = `勝 ${score.w} ・ 平 ${score.t} ・ 負 ${score.l}`;
}));

// ---------- 電子木魚 ----------
let merit = 0, muted = false;
try{
  merit = parseInt(localStorage.getItem("merit") || "0", 10) || 0;
  muted = localStorage.getItem("muted") === "1";
}catch(e){}
$("fishCount").textContent = "功德 " + merit;
$("muteBtn").textContent = muted ? "🔇" : "🔊";

let audioCtx = null;
function knock(){
  if (muted) return;
  try{
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    const t = audioCtx.currentTime;
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.type = "sine";
    o.frequency.setValueAtTime(900, t);
    o.frequency.exponentialRampToValueAtTime(420, t + 0.09);
    g.gain.setValueAtTime(0.6, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.18);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(t); o.stop(t + 0.2);
  }catch(e){}
}
$("fishBtn").addEventListener("click", () => {
  merit++;
  try{ localStorage.setItem("merit", merit); }catch(e){}
  $("fishCount").textContent = "功德 " + merit;
  knock();
  if (navigator.vibrate) navigator.vibrate(12);

  const p = document.createElement("span");
  p.className = "plus";
  p.textContent = "功德 +1";
  $("fishBox").appendChild(p);
  setTimeout(() => p.remove(), 900);
});
$("muteBtn").addEventListener("click", () => {
  muted = !muted;
  $("muteBtn").textContent = muted ? "🔇" : "🔊";
  try{ localStorage.setItem("muted", muted ? "1" : "0"); }catch(e){}
});

renderList();
loadSheet();
</script>
